<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>小红书 xhs.share Demo</title>
  <!--
    ⚠️ 安全提示
    本文件仅作 aiautoedit 离线开发演示使用，请勿部署到公网。
    下方的 appKey / nonce / timestamp / signature 全部为占位符，
    真实值必须由后端接口实时签名生成，绝不能写死在静态文件里。
  -->
</head>
<body>
  <button onclick="start()">开始</button>

  <script src="https://fe-static.xhscdn.com/biz-static/goten/xhs-1.0.1.js"></script>
  <script>
    // 占位符：从 window.__XHS_CONFIG__ 注入
    const CONFIG = window.__XHS_CONFIG__ || {
      appKey: 'YOUR_XHS_APP_KEY',
      nonce: 'RANDOM_NONCE_FROM_BACKEND',
      timestamp: Date.now(),
      signature: 'BACKEND_GENERATED_SIGNATURE',
    }

    function start() {
      xhs.share({
        shareInfo: {
          type: 'video',
          title: '',
          content: '',
          images: [],
          video: '',
          cover: '',
        },
        verifyConfig: {
          appKey: CONFIG.appKey,
          nonce: CONFIG.nonce,
          timestamp: CONFIG.timestamp,
          signature: CONFIG.signature,
        },
        fail: (e) => {
          console.error('[xhs.share failed]', e)
        },
      })
    }
  </script>
</body>
</html>
