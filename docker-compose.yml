services:
  mongodb:
    image: mongo:latest
    container_name: aiautoedit-mongodb
    restart: unless-stopped
    entrypoint: ["bash", "-c", "openssl rand -base64 756 > /data/mongodb-keyfile && chmod 400 /data/mongodb-keyfile && chown mongodb:mongodb /data/mongodb-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/mongodb-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD must be set in .env}
    ports:
      - "27018:27017"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - aiautoedit-network
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch(e) { 0 }"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongodb-rs-init:
    image: mongo:latest
    container_name: aiautoedit-mongodb-rs-init
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "sleep 5 && mongosh mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD}@mongodb:27017/?authSource=admin --eval \"try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) } catch(e) { if (e.codeName!=='AlreadyInitialized') throw e }\""]
    restart: "no"
    networks:
      - aiautoedit-network

  redis:
    image: redis:latest
    container_name: aiautoedit-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "6380:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - redis-data:/data
    networks:
      - aiautoedit-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: aiautoedit-rustfs
    hostname: rustfs.local
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
      RUSTFS_ALLOW_INSECURE_DEFAULT_CREDENTIALS: "true"
    ports:
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      aiautoedit-network:
        aliases:
          - rustfs.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  aitoearn-init:
    image: node:lts-alpine
    container_name: aiautoedit-init
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./scripts/init.mjs:/app/init.mjs:ro
      - ./scripts/init-package.json:/app/package.json:ro
      - init-data:/data/init
    working_dir: /app
    environment:
      MONGO_URI: ${INIT_MONGO_URI:-mongodb://admin:${MONGO_INITDB_ROOT_PASSWORD:-password}@mongodb:27017}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      DB_NAME: ${DB_NAME:-aitoearn}
      AUTO_LOGIN_TOKEN_PATH: /data/init/token.txt
    entrypoint: /bin/sh -c "npm install --omit=dev 2>/dev/null && node init.mjs"
    networks:
      - aiautoedit-network

  rustfs-init:
    image: minio/mc:latest
    container_name: aiautoedit-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - aiautoedit-network
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?RUSTFS_ACCESS_KEY must be set in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?RUSTFS_SECRET_KEY must be set in .env}
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs.local:9000 $RUSTFS_ACCESS_KEY $RUSTFS_SECRET_KEY;
      mc mb rustfs/aitoearn --ignore-existing;
      mc anonymous set download rustfs/aitoearn;
      exit 0;
      "

  aitoearn-ai:
    image: ${IMAGE_REGISTRY:-ghcr.io/marble1009}/aiautoedit-ai:latest
    build:
      context: ./project/aitoearn-backend/tmp/docker-context-ai
      dockerfile: Dockerfile
      args:
        - APP_NAME=aitoearn-ai
    pull_policy: if_not_present
    container_name: aiautoedit-ai
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./project/aitoearn-backend/apps/aitoearn-ai/config/config.js:/app/config.js:ro
    deploy:
      resources:
        limits:
          memory: 1024M
    networks:
      - aitoearn-network
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_NAME: aitoearn-ai

      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}

      SERVER_URL: http://aitoearn-server:3002

      # 注意：以下 ASSETS_CONFIG 中的 endpoint 是容器内网地址；
      # publicEndpoint / cdnEndpoint 走宿主机对外暴露的端口，由 PUBLIC_ASSETS_HOST 控制
      ASSETS_CONFIG: '{"provider":"s3","region":"us-east-1","bucketName":"aitoearn","endpoint":"http://rustfs.local:9000","publicEndpoint":"${PUBLIC_ASSETS_HOST:-http://127.0.0.1:9010}","cdnEndpoint":"${PUBLIC_CDN_HOST:-http://127.0.0.1/oss}","accessKeyId":"${RUSTFS_ACCESS_KEY:-rustfsadmin}","secretAccessKey":"${RUSTFS_SECRET_KEY:-rustfsadmin}","forcePathStyle":true}'

      # AI Services —— 全部从环境变量注入，不允许在 compose 中给出默认值
      AI_NVIDIA_API_KEY: ${AI_NVIDIA_API_KEY:-}
      # 文本主通道：minimax-M3
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:?MINIMAX_API_KEY must be set in .env}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      # 阿里百炼 Wanxiang：图片 / 视频
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:?DASHSCOPE_API_KEY must be set in .env}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      # OpenAI 兼容（可选；与 MINIMAX 互斥，MINIMAX 优先）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set in .env}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      # 文本兜底（DeepSeek，可选）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      VOLCENGINE_API_KEY: ${VOLCENGINE_API_KEY:-}
      VOLCENGINE_ACCESS_KEY_ID: ${VOLCENGINE_ACCESS_KEY_ID:-}
      VOLCENGINE_SECRET_ACCESS_KEY: ${VOLCENGINE_SECRET_ACCESS_KEY:-}
      VOLCENGINE_VOD_SPACE_NAME: ${VOLCENGINE_VOD_SPACE_NAME:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
      GEMINI_KEY_PAIRS: ${GEMINI_KEY_PAIRS:-[]}
      GEMINI_LOCATION: ${GEMINI_LOCATION:-us-central1}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-server:
    image: ${IMAGE_REGISTRY:-ghcr.io/marble1009}/aiautoedit-server:latest
    build:
      context: ./project/aitoearn-backend/tmp/docker-context-server
      dockerfile: Dockerfile
      args:
        - APP_NAME=aitoearn-server
    pull_policy: if_not_present
    container_name: aiautoedit-server
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    volumes:
      - ./project/aitoearn-backend/apps/aitoearn-server/config/config.js:/app/config.js:ro
    networks:
      - aiautoedit-network
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_NAME: aitoearn-server
      APP_DOMAIN: ${APP_DOMAIN:-aiautoedit.art}

      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-password}

      AI_URL: http://aitoearn-ai:3010

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?INTERNAL_TOKEN must be set in .env}

      ASSETS_CONFIG: '{"provider":"s3","region":"us-east-1","bucketName":"aitoearn","endpoint":"http://rustfs.local:9000","publicEndpoint":"${PUBLIC_ASSETS_HOST:-http://127.0.0.1:9010}","cdnEndpoint":"${PUBLIC_CDN_HOST:-http://127.0.0.1/oss}","accessKeyId":"${RUSTFS_ACCESS_KEY:-rustfsadmin}","secretAccessKey":"${RUSTFS_SECRET_KEY:-rustfsadmin}","forcePathStyle":true}'

      MAIL_HOST: ${MAIL_HOST:-smtp.exmail.qq.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USER: ${MAIL_USER:-aitoearn@aiautoedit.art}
      MAIL_PASS: ${MAIL_PASS:?MAIL_PASS must be set in .env}

      # Third-party OAuth —— 生产凭据必须从 .env 注入；空值意味着该平台暂未启用
      BILIBILI_CLIENT_ID: ${BILIBILI_CLIENT_ID:-}
      BILIBILI_CLIENT_SECRET: ${BILIBILI_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      KWAI_CLIENT_ID: ${KWAI_CLIENT_ID:-}
      KWAI_CLIENT_SECRET: ${KWAI_CLIENT_SECRET:-}
      PINTEREST_CLIENT_ID: ${PINTEREST_CLIENT_ID:-}
      PINTEREST_CLIENT_SECRET: ${PINTEREST_CLIENT_SECRET:-}
      TIKTOK_CLIENT_ID: ${TIKTOK_CLIENT_ID:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      FACEBOOK_CONFIG_ID: ${FACEBOOK_CONFIG_ID:-}
      THREADS_CLIENT_ID: ${THREADS_CLIENT_ID:-}
      THREADS_CLIENT_SECRET: ${THREADS_CLIENT_SECRET:-}
      INSTAGRAM_CLIENT_ID: ${INSTAGRAM_CLIENT_ID:-}
      INSTAGRAM_CLIENT_SECRET: ${INSTAGRAM_CLIENT_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
      WXPLAT_APP_ID: ${WXPLAT_APP_ID:-}
      WXPLAT_APP_SECRET: ${WXPLAT_APP_SECRET:-}
      WXPLAT_ENCODING_AES_KEY: ${WXPLAT_ENCODING_AES_KEY:-}
      DOYIN_CLIENT_ID: ${DOYIN_CLIENT_ID:?DOYIN_CLIENT_ID must be set in .env}
      DOYIN_CLIENT_SECRET: ${DOYIN_CLIENT_SECRET:?DOYIN_CLIENT_SECRET must be set in .env}

      # Aliyun SMS
      ALI_SMS_ACCESS_KEY_ID: ${ALI_SMS_ACCESS_KEY_ID:-}
      ALI_SMS_ACCESS_KEY_SECRET: ${ALI_SMS_ACCESS_KEY_SECRET:-}
      ALI_SMS_SIGN_NAME: ${ALI_SMS_SIGN_NAME:-}
      ALI_SMS_TEMPLATE_CODE: ${ALI_SMS_TEMPLATE_CODE:-}

      # Relay (optional) —— 留空表示不启用
      RELAY_SERVER_URL: ${RELAY_SERVER_URL:-https://aitoearn.cn/api}
      RELAY_API_KEY: ${RELAY_API_KEY:-}
      RELAY_CALLBACK_URL: ${RELAY_CALLBACK_URL:-https://${APP_DOMAIN:-aiautoedit.art}/api/plat/relay-callback}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  aitoearn-web:
    image: ${IMAGE_REGISTRY:-ghcr.io/marble1009}/aiautoedit-web:latest
    build:
      context: ./project/aitoearn-web
      dockerfile: Dockerfile
    pull_policy: if_not_present
    container_name: aiautoedit-web
    restart: unless-stopped
    depends_on:
      aitoearn-server:
        condition: service_healthy
    volumes:
      - init-data:/data/init:ro
    networks:
      - aiautoedit-network
    command: ["/bin/sh", "-c", "exec node server.js"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1

  nginx:
    image: nginx:alpine
    container_name: aiautoedit-nginx
    restart: unless-stopped
    depends_on:
      aitoearn-web:
        condition: service_started
      aitoearn-server:
        condition: service_healthy
      aitoearn-ai:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "9010:9000"
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - aiautoedit-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/_nhealth"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  aiautoedit-network:
    driver: bridge
    name: aiautoedit-network

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  rustfs-data:
    driver: local
  init-data:
    driver: local
